name: Publish to MCP Registry

# Publishes one package's server.json to the official MCP Registry (registry.modelcontextprotocol.io).
# Authenticates with GitHub OIDC, which proves this repo belongs to the tagpilot org, so no secrets
# are needed. The npm package must already be published with the same version (npm publish stays
# a manual step).
#
# Tags: ga4-mcp-v<version> → packages/ga4-mcp (io.github.tagpilot/ga4-mcp)
#       search-console-mcp-v<version> → packages/search-console-mcp (io.github.tagpilot/search-console-mcp)
#       v<version> → packages/ga4-mcp (the scheme before the monorepo)
on:
  push:
    tags: ["ga4-mcp-v*", "search-console-mcp-v*", "v*"]
  workflow_dispatch:
    inputs:
      package:
        description: Package to publish
        type: choice
        options: [ga4-mcp, search-console-mcp]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # OIDC login to the registry
      contents: read

    steps:
      - uses: actions/checkout@v5

      - name: Pick the package
        id: pkg
        env:
          INPUT_PACKAGE: ${{ inputs.package }}
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            case "${GITHUB_REF_NAME}" in
              search-console-mcp-v*) NAME=search-console-mcp; TAG_VERSION="${GITHUB_REF_NAME#search-console-mcp-v}" ;;
              ga4-mcp-v*) NAME=ga4-mcp; TAG_VERSION="${GITHUB_REF_NAME#ga4-mcp-v}" ;;
              v*) NAME=ga4-mcp; TAG_VERSION="${GITHUB_REF_NAME#v}" ;;
              *) echo "::error::unknown tag ${GITHUB_REF_NAME}"; exit 1 ;;
            esac
          else
            NAME="${INPUT_PACKAGE}"; TAG_VERSION=""
          fi
          echo "dir=packages/${NAME}" >> "$GITHUB_OUTPUT"
          echo "tag_version=${TAG_VERSION}" >> "$GITHUB_OUTPUT"
          echo "Publishing packages/${NAME}"

      - name: Check versions (package.json, server.json, npm)
        working-directory: ${{ steps.pkg.outputs.dir }}
        env:
          TAG_VERSION: ${{ steps.pkg.outputs.tag_version }}
        run: |
          PKG=$(jq -r .version package.json)
          SRV=$(jq -r .version server.json)
          NAME=$(jq -r .name package.json)
          MCPNAME=$(jq -r .mcpName package.json)
          echo "package.json $PKG, server.json $SRV, mcpName $MCPNAME"
          test "$PKG" = "$SRV" || { echo "::error::server.json version $SRV != package.json $PKG"; exit 1; }
          test "$MCPNAME" = "$(jq -r .name server.json)" || { echo "::error::mcpName != server.json name"; exit 1; }
          if [ -n "$TAG_VERSION" ]; then
            test "$TAG_VERSION" = "$PKG" || { echo "::error::tag ${GITHUB_REF_NAME} is $TAG_VERSION, package.json is $PKG"; exit 1; }
          fi
          npm view "$NAME@$PKG" version >/dev/null || { echo "::error::$NAME@$PKG is not on npm yet; publish it first"; exit 1; }
          test "$(npm view "$NAME@$PKG" mcpName)" = "$MCPNAME" || { echo "::error::published package lacks mcpName $MCPNAME"; exit 1; }

      - name: Skip if this version is already in the registry
        id: existing
        working-directory: ${{ steps.pkg.outputs.dir }}
        run: |
          NAME=$(jq -r .name server.json); VERSION=$(jq -r .version server.json)
          FOUND=$(curl -fsS "https://registry.modelcontextprotocol.io/v0.1/servers?search=${NAME}" | jq --arg n "$NAME" --arg v "$VERSION" '[.servers[] | (.server // .) | select(.name == $n and .version == $v)] | length')
          echo "found=$FOUND" >> "$GITHUB_OUTPUT"
          [ "$FOUND" = "0" ] || echo "::notice::$NAME@$VERSION is already published; nothing to do."

      - name: Install mcp-publisher
        working-directory: ${{ steps.pkg.outputs.dir }}
        if: steps.existing.outputs.found == '0'
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher
          ./mcp-publisher --version

      - name: Authenticate to MCP Registry
        working-directory: ${{ steps.pkg.outputs.dir }}
        if: steps.existing.outputs.found == '0'
        run: ./mcp-publisher login github-oidc

      - name: Publish server to MCP Registry
        working-directory: ${{ steps.pkg.outputs.dir }}
        if: steps.existing.outputs.found == '0'
        run: ./mcp-publisher publish
